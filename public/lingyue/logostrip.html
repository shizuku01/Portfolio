<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px 40px;
    padding: 10px 20px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    height: 40px;
  }
  .logo-wrap img {
    height: 40px !important;
    width: auto !important;
    max-height: 40px !important;
    display: block;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="logo-wrap"><img src="img/平安证券.png" alt="平安证券"></div>
  <div class="logo-wrap"><img src="img/东莞证券.png" alt="东莞证券"></div>
  <div class="logo-wrap"><img src="img/博源基金.png" alt="博源基金"></div>
  <div class="logo-wrap"><img src="img/招商基金.png" alt="招商基金"></div>
  <div class="logo-wrap"><img src="img/汇丰银行.png" alt="汇丰银行"></div>
  <div class="logo-wrap"><img src="img/腾讯科技.svg" alt="腾讯科技"></div>
  <div class="logo-wrap"><img src="img/金证股份.png" alt="金证股份"></div>
</body>
</html>
